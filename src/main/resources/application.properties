spring.application.name=embedding
spring.datasource.url=jdbc:postgresql://localhost:5432/embeddings
spring.datasource.username=embedding_user
spring.datasource.password=embedding_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.config.import=optional:file:.env[.properties]

spring.ai.google.genai.embedding.api-key=${GEMINI_API}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=1536
